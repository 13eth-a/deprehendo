[package]
name = "deprehendo-trace"
version = "0.1.0"
edition = "2021"
description = "Deprehendo Phase 6 low-level lifecycle tracer (Linux-only sensor feeding the Go agent)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "deprehendo-trace"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
